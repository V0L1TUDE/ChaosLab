<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — ChaosLab</title>
<link rel="stylesheet" href="/ChaosLab/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/ChaosLab/" class="brand"><span class="bracket">[</span>ChaosLab<span class="bracket">]</span><span class="cursor"></span></a>
    <div class="nav-links">
      <a href="/ChaosLab/">Home</a>
      <a href="/ChaosLab/project/">Project</a>
      <a href="/ChaosLab/architecture/">Architecture</a>
      <a href="/ChaosLab/presentations/">Presentations</a>
      <a href="/ChaosLab/#team">Team</a>
    </div>
    <div class="nav-right">
      <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>
<div class="mobile-menu">
  <a href="/ChaosLab/">Home</a>
  <a href="/ChaosLab/project/">Project</a>
  <a href="/ChaosLab/architecture/">Architecture</a>
  <a href="/ChaosLab/presentations/">Presentations</a>
  <a href="/ChaosLab/#team">Team</a>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="bracket">[</span>ChaosLab<span class="bracket">]</span></div>
    <div class="auth-sub">ADMIN&nbsp;/&nbsp;INSTRUCTOR&nbsp;ACCESS</div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="e.g. instructor" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
      <div id="login-msg" class="form-msg mono"></div>
    </form>

    <p style="margin-top:22px; font-size:11.5px; color:var(--text-faint); text-align:center; font-family:var(--mono);">
      This form really calls POST /api/auth/login — the server just honestly replies "not implemented yet" (Phase 5).
    </p>
    <p style="margin-top:10px; font-size:11.5px; text-align:center; font-family:var(--mono);">
      <a href="/ChaosLab/admin/dashboard/" style="color:var(--accent); text-decoration:underline;">Preview dashboard UI without logging in →</a>
    </p>
  </div>
</div>

<script src="/ChaosLab/js/main.js"></script>
<script src="/ChaosLab/js/admin.js"></script>
</body>
</html>
